<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- terrible comet tail -->
  <path d="M3 28 L16 15" stroke="#00ffff" stroke-width="3" stroke-linecap="round"/>
  <path d="M6 30 L18 18" stroke="#ff00ff" stroke-width="2" stroke-linecap="round"/>
  <path d="M1 23 L13 12" stroke="#ffff00" stroke-width="2" stroke-linecap="round"/>

  <!-- star body -->
  <polygon
    points="20,2 23,12 31,12 24.5,17 27,27 20,21 13,27 15.5,17 9,12 17,12"
    fill="#ffff00"
    stroke="#ff00ff"
    stroke-width="1.5"
    filter="url(#glow)"
  />

  <!-- click point marker, obnoxious -->
  <circle cx="20" cy="12" r="2" fill="#ffffff"/>
</svg>
